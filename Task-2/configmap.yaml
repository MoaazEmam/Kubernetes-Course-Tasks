apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
  namespace: webapp-stack
data:
  APP_TITLE: "hello in MLOPS MENA COMMUNITY"
  APP_ENV: dev
  MYSQL_HOST: mysql #the mysql Service name = its DNS name
  MYSQL_PORT: "3306" #must be a string; also overrides the MYSQL_PORT=tcp://... var k8s injects for the mysql Service
  MYSQL_DATABASE: webapp
